
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Form Submitted Successfully</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #eaf3ff;
            font-family: Arial, sans-serif;
        }

        .success-box {
            background-color: white;
            padding: 50px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 650px;
            margin: 120px auto;
            box-shadow: 0 5px 20px rgba(9,43,89,0.1);
        }

        .check {
            font-size: 60px;
            color: #1769d2;
        }

        h1 {
            color: #092b59;
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
        }

        p {
            color: #65758b;
            font-size: 17px;
        }

        .home-btn {
            background-color: #1769d2;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 15px;
        }

        .home-btn:hover {
            background-color: #092b59;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="success-box">

            <div class="check">✓</div>

            <h1>Your Form Has Been Submitted Successfully!</h1>

            <p>
                Thank you for applying to Bluvion Technologies.
                We appreciate your interest in joining our team.
            </p>

            <a href="index.html" class="home-btn">
                Back to Home
            </a>

        </div>

    </div>

</html>
